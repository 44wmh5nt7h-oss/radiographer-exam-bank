    <meta
      name="description"

    <main class="wrap">
      <section class="hero">
        <span class="eyebrow">Wrong Notebook</span>
        <h1>錯題本功能</h1>
        <p>錯題本會自動整理答錯題目，協助考生重複複習高風險題目，提升考前回顧效率。</p>
        <div class="actions">

      <section class="grid">
        <article class="card">
          <h2>自動整理錯題</h2>
          <p>完成作答後，答錯的題目會被整理到錯題本，方便之後逐題回頭檢查。</p>

          <h2>提升複習效率</h2>
          <p>錯題本能集中高風險題目，讓考生更容易安排重點複習與查漏補缺。</p>
        </article>
        <article class="card">
          <h2>不公開個人內容</h2>
          <p>此頁只說明錯題本功能，不顯示任何真實使用者的錯題內容或個人進度資料。</p>
