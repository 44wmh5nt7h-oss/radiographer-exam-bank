<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>題庫練習｜放射師國考歷屆試題刷題</title>
    <meta
      name="description"
      content="放射師國考刷題庫提供歷屆試題練習、科目篩選、作答結果檢視與答題狀態記錄，協助考生安排日常刷題。"
    />
    <link rel="canonical" href="https://radiographer-exam-bank.pages.dev/question-bank" />
    <link rel="stylesheet" href="/seo-pages.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <span class="eyebrow">Question Bank</span>
        <h1>題庫練習功能</h1>
        <p>題庫練習是放射師國考刷題庫的核心入口，提供歷屆試題刷題、科目篩選與作答結果檢視。</p>
        <div class="actions">
          <a class="button button-primary" href="/">開始刷題</a>
          <a class="button button-secondary" href="/features">查看功能介紹</a>
        </div>
      </section>

      <section class="grid">
        <article class="card">
          <h2>科目與年份篩選</h2>
          <p>可依考科篩選題目，也能設定年份範圍，載入指定區間的歷屆試題。</p>
        </article>
        <article class="card">
          <h2>作答狀態記錄</h2>
          <p>作答後可查看答對、答錯與未作答狀態，並延伸到錯題本與收藏題。</p>
        </article>
        <article class="card">
          <h2>結果檢視</h2>
          <p>完成單科限時測驗後，可檢視答題結果與分數，掌握當次練習表現。</p>
        </article>
      </section>
    </main>
  </body>
</html>
